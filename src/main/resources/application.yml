server:
  port: 9095

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:talon}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:talon}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:password}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KC_ISSUER}
      client:
        registration:
          keycloak:
            client-id: ${KC_INTERNAL_CLIENT_ID}
            client-secret: ${KC_INTERNAL_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: openid, profile
        provider:
          keycloak:
            issuer-uri: ${KC_ISSUER}
