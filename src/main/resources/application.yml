server:
  port: ${SERVER_PORT:9095}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:talon}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:talon}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:password}}
    driver-class-name: org.postgresql.Driver
  mvc:
    problemdetails:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # Externalized to Postgres, not in-memory — this runs 2 replicas behind a
  # canary rollout, which an in-memory HttpSession wouldn't survive.
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
  security:
    oauth2:
      client:
        registration:
          # Staff app + Swagger login, gated by role, not a separate client.
          keycloak:
            client-id: ${KC_CORE_CLIENT_ID}
            client-secret: ${KC_CORE_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: openid, profile, roles
          # Service-account-only registration for calling Keycloak's Admin
          # REST API (user provisioning) — never involved in a browser flow.
          keycloak-admin:
            client-id: ${KC_ADMIN_CLIENT_ID}
            client-secret: ${KC_ADMIN_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            provider: keycloak
        provider:
          keycloak:
            issuer-uri: ${KC_ISSUER}

app:
  frontend-url: ${FRONTEND_URL}
  keycloak-admin-api-base: ${KC_ADMIN_API_BASE}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL}}
